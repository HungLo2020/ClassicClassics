[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
quasar-ui = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.16", default-features = false, features = ["render2d"] }
quasar-audio = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.16", default-features = false }
quasar-config = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.16", default-features = false, features = ["json", "toml"] }
quasar-core = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.16" }
quasar-input = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.16" }
quasar-render-2d = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.16", default-features = false, features = ["png"] }
quasar-storage = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.16" }
quasar-window = { git = "https://github.com/HungLo2020/Quasar", tag = "v0.2.16" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
classicclassics-core = { path = "crates/classicclassics-core" }
classicclassics-collection = { path = "crates/classicclassics-collection", default-features = false }
classicclassics-pong = { path = "crates/classicclassics-pong" }
classicclassics-lunar = { path = "crates/classicclassics-lunar" }
classicclassics-asteroids = { path = "crates/classicclassics-asteroids" }

classicclassics-micromages = { path = "crates/classicclassics-micromages" }

classicclassics-jackal = { path = "crates/classicclassics-jackal" }

classicclassics-missile-command = { path = "crates/classicclassics-missile-command" }

classicclassics-river-raid = { path = "crates/classicclassics-river-raid" }

[package]
name = "classicclassics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A Quasar-powered collection of classic arcade games"

[features]
default = ["desktop", "gamepad", "audio"]
desktop = ["dep:quasar-window", "quasar-render-2d/gpu", "quasar-render-2d/vulkan"]
gamepad = ["quasar-input/gilrs"]
audio = ["classicclassics-collection/audio"]

[dependencies]
quasar-ui.workspace = true
classicclassics-collection.workspace = true
quasar-config.workspace = true
quasar-core.workspace = true
quasar-input.workspace = true
quasar-render-2d.workspace = true
quasar-storage.workspace = true
quasar-window = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[profile.dev.package.shaderc-sys]
opt-level = 3

[profile.release]
lto = "thin"
strip = "symbols"

[[example]]
name = "profile_imports"
path = "DevUtils/profile_imports.rs"

# The imported CPU renderers need the same optimized development behavior as
# their original applications. Keep host code debuggable without slow pixel loops.
[profile.dev.package.classicclassics-micromages]
opt-level = 1
[profile.dev.package.classicclassics-jackal]
opt-level = 1
[profile.dev.package.classicclassics-missile-command]
opt-level = 1
[profile.dev.package.classicclassics-river-raid]
opt-level = 1
[profile.dev.package.classicclassics-core]
opt-level = 1
# Real-time callbacks and asset codecs also need optimization in cargo run.
# In particular, decoding the imported WAV/PNG assets unoptimized is very slow.
[profile.dev.package.quasar-audio]
opt-level = 1
[profile.dev.package.quasar-render-2d]
opt-level = 1
[profile.dev.package.image]
opt-level = 1
[profile.dev.package.png]
opt-level = 1
