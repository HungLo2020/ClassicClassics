name: Release
run-name: Release Latest (${{ inputs.commit }})

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the current main commit with successful CI
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: classicclassics-release-latest
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Require an explicit main commit
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          python3 - <<'PY'
          import os, re
          assert os.environ["GITHUB_REF"] == "refs/heads/main", "dispatch Release on main"
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["RELEASE_COMMIT"]), "provide a full commit SHA"
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Require successful CI for the requested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: python3 -m DevUtils.release --check-only --commit "$RELEASE_COMMIT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libudev-dev \
            libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libvulkan-dev
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: |
          python3 DevUtils/package.py
          python3 DevUtils/verify_package.py dist/ClassicClassics-*-linux-x64.zip
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: ClassicClassics-linux-x64
          path: dist/*.zip
          if-no-files-found: error
      - name: Replace the rolling Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: python3 -m DevUtils.release --commit "$RELEASE_COMMIT" --archive dist/ClassicClassics-*-linux-x64.zip
